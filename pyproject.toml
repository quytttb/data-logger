[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "data-logger"
dynamic = ["version"]
description = "Data Logger — Modbus sensor monitoring, SQLite storage, scheduled sFTP reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "sqlmodel>=0.0.22",
    "alembic>=1.18.4",
    "pymodbus[serial]>=3.13.0",
    "pyserial>=3.5",
    "asyncssh>=2.17",
    "cryptography>=48.0.0",
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8.0",
    "build>=1.5.0",
]

[tool.hatch.version]
path = "core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["core", "models", "ui", "workers"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".github",
    ".venv",
    "plan",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "W293",
]
