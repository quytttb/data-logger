[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "data-logger"
dynamic = ["version"]
description = "Data Logger — Modbus sensor monitoring, SQLite storage, scheduled sFTP reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.1",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "pymodbus[serial]>=3.13.0",
    "pyserial>=3.5",
    "asyncssh>=2.23.0",
    "cryptography>=48.0.0",
    "paho-mqtt>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "build>=1.5.0",
    "pyzbar>=0.1.9",
    "pillow>=10.0",
]

[tool.hatch.version]
path = "core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["core", "models", "ui", "workers"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".github",
    ".venv",
    "plan",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "W293",
]
