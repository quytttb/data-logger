<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#353534",
                    "on-secondary-container": "#00622e",
                    "primary-container": "#558dff",
                    "error": "#ffb4ab",
                    "surface-container-low": "#1c1b1b",
                    "tertiary": "#ffb3ae",
                    "inverse-primary": "#0058ca",
                    "surface-container-highest": "#353534",
                    "secondary-fixed": "#62ff96",
                    "primary-fixed-dim": "#b0c6ff",
                    "on-tertiary": "#68000c",
                    "primary-fixed": "#d9e2ff",
                    "tertiary-fixed": "#ffdad7",
                    "on-surface-variant": "#c2c6d7",
                    "surface": "#131313",
                    "on-secondary-fixed-variant": "#005226",
                    "tertiary-fixed-dim": "#ffb3ae",
                    "secondary-fixed-dim": "#00e475",
                    "on-tertiary-fixed": "#410004",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-container": "#5c0009",
                    "on-secondary-fixed": "#00210b",
                    "on-surface": "#e5e2e1",
                    "surface-tint": "#b0c6ff",
                    "tertiary-container": "#ff5353",
                    "secondary": "#7dffa2",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#001945",
                    "on-primary-fixed-variant": "#00429b",
                    "inverse-on-surface": "#313030",
                    "on-background": "#e5e2e1",
                    "secondary-container": "#05e777",
                    "surface-container": "#201f1f",
                    "primary": "#b0c6ff",
                    "outline-variant": "#424655",
                    "on-error": "#690005",
                    "on-secondary": "#003918",
                    "on-primary": "#002d6e",
                    "on-tertiary-fixed-variant": "#930015",
                    "surface-bright": "#393939",
                    "background": "#131313",
                    "surface-container-high": "#2a2a2a",
                    "surface-container-lowest": "#0e0e0e",
                    "surface-dim": "#131313",
                    "inverse-surface": "#e5e2e1",
                    "on-primary-container": "#002661",
                    "outline": "#8c90a0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 16px;
        }
        ::-webkit-scrollbar-track {
            background: #131313;
        }
        ::-webkit-scrollbar-thumb {
            background: #393939;
            border: 4px solid #131313;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 bg-[#131313] text-[#b0c6ff] font-['Inter'] font-bold text-[28px] tracking-tight docked full-width top-0 h-[64px] shadow-[0_0_20px_rgba(125,255,162,0.1)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[32px]">sensors</span>
<span>Data Logger</span>
</div>
<div class="flex items-center gap-6">
<span class="text-xl font-black text-[#b0c6ff] uppercase tracking-widest hidden lg:block">SYSTEM</span>
<span class="text-[#7dffa2] font-mono text-2xl">12:45:30</span>
</div>
</header>
<div class="flex h-screen pt-[64px]">
<!-- NavigationDrawer -->
<aside class="fixed left-0 top-[64px] h-[calc(100%-64px)] w-[240px] flex flex-col pt-4 bg-[#1c1b1b] border-r border-[#424655]/20 font-['Inter'] font-semibold text-[16px] uppercase">
<nav class="flex flex-col gap-2">
<div class="text-[#b0c6ff] opacity-70 hover:opacity-100 mx-2 my-1 p-4 flex items-center gap-4 cursor-pointer hover:bg-[#2a2a2a] rounded-lg transition-all">
<span class="material-symbols-outlined">dashboard</span>
<span>Dashboard</span>
</div>
<div class="text-[#b0c6ff] opacity-70 hover:opacity-100 mx-2 my-1 p-4 flex items-center gap-4 cursor-pointer hover:bg-[#2a2a2a] rounded-lg transition-all">
<span class="material-symbols-outlined">history</span>
<span>History</span>
</div>
<!-- Active Tab: Settings -->
<div class="bg-[#558dff] text-[#131313] rounded-lg mx-2 my-1 p-4 flex items-center gap-4 cursor-pointer shadow-lg shadow-[#558dff]/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span>Settings</span>
</div>
</nav>
</aside>
<!-- Main Content Canvas -->
<main class="ml-[240px] flex-1 h-full overflow-y-auto pb-[100px]">
<div class="max-w-5xl mx-auto p-8 space-y-12">
<!-- Page Title -->
<div class="flex items-center gap-4 border-l-8 border-primary-container pl-6 py-2">
<h1 class="text-4xl font-black uppercase tracking-tight text-primary">Cấu hình hệ thống</h1>
</div>
<!-- Group 1: Thông tin Trạm -->
<section class="bg-surface-container-low rounded-xl p-8 space-y-8 shadow-inner">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-3xl">hub</span>
<h2 class="text-2xl font-bold uppercase text-secondary">Thông tin Trạm</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Mã trạm</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-primary focus:ring-0 focus:border-primary-container h-[80px]" type="text" value="STATION_001_HANOI"/>
</div>
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Chu kỳ đọc (Giây)</label>
<div class="flex items-center gap-2">
<button class="w-20 h-[80px] bg-surface-container-high flex items-center justify-center text-4xl font-bold text-on-surface hover:bg-surface-bright active:scale-95 transition-all">-</button>
<input class="flex-1 bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-center text-primary focus:ring-0 focus:border-primary-container h-[80px]" type="number" value="60"/>
<button class="w-20 h-[80px] bg-surface-container-high flex items-center justify-center text-4xl font-bold text-on-surface hover:bg-surface-bright active:scale-95 transition-all">+</button>
</div>
</div>
</div>
</section>
<!-- Group 2: Cấu hình Server FTP -->
<section class="bg-surface-container-low rounded-xl p-8 space-y-8 shadow-inner">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">cloud_upload</span>
<h2 class="text-2xl font-bold uppercase text-primary">Cấu hình Server FTP</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10">
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Địa chỉ IP</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-primary-fixed-dim focus:ring-0 focus:border-primary-container h-[80px]" placeholder="192.168.1.100" type="text"/>
</div>
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Cổng (Port)</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-primary-fixed-dim focus:ring-0 focus:border-primary-container h-[80px]" type="number" value="21"/>
</div>
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Tài khoản</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-primary-fixed-dim focus:ring-0 focus:border-primary-container h-[80px]" placeholder="admin_industrial" type="text"/>
</div>
<div class="space-y-4">
<label class="block text-[20px] font-bold text-outline uppercase tracking-wider">Mật khẩu</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-3xl font-mono text-primary-fixed-dim focus:ring-0 focus:border-primary-container h-[80px]" type="password" value="********"/>
</div>
</div>
</section>
<!-- Group 3: Cài đặt Cảm biến -->
<section class="bg-surface-container-low rounded-xl p-8 space-y-8 shadow-inner">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-amber-400 text-3xl">precision_manufacturing</span>
<h2 class="text-2xl font-bold uppercase text-amber-400">Cài đặt Cảm biến</h2>
</div>
<span class="bg-amber-400/10 text-amber-400 px-4 py-2 rounded-full font-bold text-sm tracking-widest uppercase border border-amber-400/20">MODBUS RTU active</span>
</div>
<div class="bg-surface-container-high rounded-lg p-10 space-y-10 border-l-[12px] border-amber-400">
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div class="space-y-4">
<label class="block text-[18px] font-black text-outline uppercase">Slave ID</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-4xl font-black text-on-surface focus:ring-0 focus:border-amber-400 h-[90px]" type="number" value="1"/>
</div>
<div class="space-y-4">
<label class="block text-[18px] font-black text-outline uppercase">Địa chỉ (Address)</label>
<input class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-4xl font-black text-on-surface focus:ring-0 focus:border-amber-400 h-[90px]" type="text" value="40001"/>
</div>
<div class="space-y-4">
<label class="block text-[18px] font-black text-outline uppercase">Kiểu dữ liệu</label>
<select class="w-full bg-surface-container-lowest border-0 border-b-4 border-outline p-6 text-2xl font-black text-on-surface focus:ring-0 focus:border-amber-400 h-[90px] appearance-none">
<option>FLOAT32 (ABCD)</option>
<option>INT16</option>
<option>UINT16</option>
<option>INT32 (CDAB)</option>
</select>
</div>
</div>
<div class="bg-surface-container-lowest p-6 rounded border border-outline-variant/20 flex items-center justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary text-4xl">check_circle</span>
<div>
<p class="text-on-surface font-bold text-xl uppercase">Kiểm tra kết nối</p>
<p class="text-outline text-sm">Trạng thái: Đang kết nối bình thường</p>
</div>
</div>
<button class="px-8 py-4 bg-surface-bright text-primary font-black uppercase text-lg hover:bg-surface-variant transition-colors border-2 border-primary/20">Test Link</button>
</div>
</div>
</section>
</div>
</main>
<!-- Fixed Bottom Bar -->
<footer class="fixed bottom-0 right-0 left-[240px] bg-surface-container-low p-4 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-50">
<button class="w-full min-h-[72px] bg-gradient-to-r from-primary to-primary-container text-on-primary-container text-[28px] font-black uppercase tracking-[0.2em] rounded-lg shadow-[0_4px_20px_rgba(85,141,255,0.4)] hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">save</span>
                LƯU CẤU HÌNH
            </button>
</footer>
</div>
</body></html>
