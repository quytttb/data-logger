name: Dev Build

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.qml'
      - '**.sh'
      - '**.toml'
      - '**.ini'
      - 'scripts/**'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev:
    name: Build & Package (Dev)
    runs-on: [self-hosted, linux, ARM64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Nuitka
        uses: actions/cache@v5
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Virtual Environment & Verify Python
        run: |
          python3 -m venv venv-build
          venv-build/bin/python --version
          venv-build/bin/pip install --upgrade pip

      - name: Install dependencies
        run: |
          venv-build/bin/pip install -e .
          venv-build/bin/pip install nuitka

      - name: Build Standalone Binary with Nuitka
        run: |
          set -euo pipefail
          PYSIDE_QML="$(venv-build/bin/python -c 'import os, PySide6; print(os.path.join(PySide6.__path__[0], "Qt", "qml"))')"
          echo "PySide6 QML imports dir: ${PYSIDE_QML}"
          test -d "${PYSIDE_QML}/QtQuick" || { echo "::error::PySide6 QML directory missing"; exit 1; }
          venv-build/bin/python -m nuitka --standalone --onefile \
            --include-data-dir=config=config \
            --include-data-dir=ui/qml=ui/qml \
            --include-data-dir=assets=assets \
            --include-data-dir="${PYSIDE_QML}=PySide6/Qt/qml" \
            --include-package=segno \
            --include-module=core.provision_qr \
            --include-module=core.lan_ip \
            --plugin-enable=pyside6 \
            --include-qt-plugins=all \
            --output-filename=datalogger \
            main.py

      - name: Generate VERSION file & Package
        run: |
          set -euo pipefail
          mkdir -p release_package

          # Sinh VERSION và gắn mác dev cùng hash của commit
          PYTHONPATH=. venv-build/bin/python -c "import core._version as v; print(v.__version__)" > VERSION.tmp
          echo "v$(cat VERSION.tmp)-dev-${GITHUB_SHA::7}" > VERSION

          # Copy các file cần thiết
          cp VERSION deploy.sh release_package/
          if [ -f datalogger ]; then
            cp datalogger release_package/
          else
            echo "::error::Nuitka binary 'datalogger' not found"
            exit 1
          fi
          cp -r config ui release_package/
          [ -d docs ] && cp -r docs release_package/

          # Nén tarball
          tar -czvf datalogger-dev-snapshot.tar.gz -C release_package .

      - name: Build .deb package
        run: |
          chmod +x scripts/build_deb.sh
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          ARCH="arm64"
          scripts/build_deb.sh "$VERSION" "$ARCH"
          echo "DEB_FILE=datalogger_${VERSION}_${ARCH}.deb" >> "$GITHUB_ENV"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalogger-dev-${{ github.sha }}
          path: |
            datalogger-dev-snapshot.tar.gz
            *.deb
          retention-days: 7
          if-no-files-found: error
