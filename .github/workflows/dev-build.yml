name: Dev Build

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build C++ (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-15 \
            qt6-base-dev qt6-declarative-dev qt6-quickcontrols2-dev \
            qt6-serialbus-dev qt6-serialport-dev \
            qt6-httpserver-dev qt6-websockets-dev \
            qt6-graphs-dev qt6-quick3d-dev

      - name: Configure
        run: |
          cmake -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build-ci --parallel $(nproc)

      - name: QML lint
        run: cmake --build build-ci --target all_qmllint all_qmllint_module 2>&1 | tee qmllint.log

      - name: QML lint warning budget
        run: |
          WARNINGS=$(grep -c "Warning:" qmllint.log || true)
          echo "qmllint warnings: $WARNINGS"
          MAX=500
          if [ "$WARNINGS" -gt "$MAX" ]; then
            echo "Exceeded max warnings ($MAX)"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataLogger-dev-${{ github.sha }}
          path: build-ci/bin/DataLogger
          retention-days: 7
