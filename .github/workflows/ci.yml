name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: "6.12.0"
  QT_MODULES: qtserialbus qtserialport qtgraphs qttasktree qtquick3d qtshadertools qthttpserver qtwebsockets qtvirtualkeyboard
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt / OpenGL system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgl1-mesa-dev libfontconfig1-dev libdbus-1-dev \
            libxkbcommon-dev libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libwayland-dev libwayland-client0 \
            patchelf socat python3 python3-pymodbus

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.workspace }}
          install-deps: false
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true
          cache-key-prefix: qt612-linux

      - name: Configure
        run: |
          PRE="${QT_ROOT_DIR}"
          if [ ! -f "${PRE}/lib/cmake/Qt6Graphs/Qt6GraphsConfig.cmake" ]; then
            PRE="$(dirname "${PRE}")/gcc_64"
          fi
          export PATH="${PRE}/bin:${PATH}"
          "${PRE}/bin/qmake6" -query QT_VERSION
          cmake -B build-ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${PRE}" \
            -DQt6_DIR="${PRE}/lib/cmake/Qt6"

      - name: Build
        run: cmake --build build-ci --parallel $(nproc)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        working-directory: build-ci
        run: ctest --output-on-failure

      - name: QML lint
        run: |
          PRE="${QT_ROOT_DIR}"
          if [ ! -f "${PRE}/lib/cmake/Qt6Graphs/Qt6GraphsConfig.cmake" ]; then
            PRE="$(dirname "${PRE}")/gcc_64"
          fi
          export PATH="${PRE}/bin:${PATH}"
          cmake --build build-ci --target all_qmllint all_qmllint_module 2>&1 | tee qmllint.log

      - name: QML lint warning budget
        run: |
          WARNINGS=$(grep -c "Warning:" qmllint.log || true)
          echo "qmllint warnings: $WARNINGS"
          MAX=200
          if [ "$WARNINGS" -gt "$MAX" ]; then
            echo "Exceeded max warnings ($MAX)"
            exit 1
          fi

      - name: Verify binary
        run: test -f build-ci/bin/DataLogger && echo "Build OK"
