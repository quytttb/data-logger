name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-15 \
            qt6-base-dev qt6-declarative-dev qt6-quickcontrols2-dev \
            qt6-serialbus-dev qt6-serialport-dev \
            qt6-httpserver-dev qt6-websockets-dev \
            qt6-graphs-dev qt6-quick3d-dev

      - name: Configure
        run: |
          cmake -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build-ci --parallel $(nproc)

      - name: Verify binary
        run: test -f build-ci/bin/DataLogger && echo "Build OK"
