name: Build Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v2.0.0)"
        required: true
        type: string

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.13.1"
  QT_INSTALL_DIR: /opt/qt6

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag (need vMAJOR.MINOR.PATCH): ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ref=refs/tags/${TAG}" >> "${GITHUB_OUTPUT}"


  build-deb-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Sync CMake project version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 packaging/linux/sync_cmake_version.py

      - name: Restore Qt ${{ env.QT_VERSION }} cache
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: qt-${{ env.QT_VERSION }}-arm64-ubuntu2404-v3-virtualkeyboard

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 perl \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgbm-dev libdrm-dev libinput-dev libudev-dev libmtdev-dev \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libdbus-1-dev libegl-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev \
            libssl-dev zlib1g-dev libsqlite3-dev libicu-dev \
            libpcre2-dev libdouble-conversion-dev libglib2.0-dev dpkg-dev

      - name: Build Qt ${{ env.QT_VERSION }} from source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC_DIR="${RUNNER_TEMP}/qt-src"
          BUILD_DIR="${RUNNER_TEMP}/qt-build"
          mkdir -p "${SRC_DIR}" "${BUILD_DIR}"

          echo ">>> Downloading Qt ${{ env.QT_VERSION }} source..."
          wget -q --show-progress \
            "https://download.qt.io/official_releases/qt/6.13/${{ env.QT_VERSION }}/single/qt-everywhere-src-${{ env.QT_VERSION }}.tar.xz" \
            -O "${RUNNER_TEMP}/qt-src.tar.xz"

          echo ">>> Extracting..."
          tar xf "${RUNNER_TEMP}/qt-src.tar.xz" -C "${SRC_DIR}" --strip-components=1

          echo ">>> Configuring (only required modules)..."
          cmake -S "${SRC_DIR}" -B "${BUILD_DIR}" \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_INSTALL_DIR }}" \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_DOCS=OFF \
            -DBUILD_qt3d=OFF \
            -DBUILD_qtactiveqt=OFF \
            -DBUILD_qtcharts=OFF \
            -DBUILD_qtcoap=OFF \
            -DBUILD_qtconnectivity=OFF \
            -DBUILD_qtdatavis3d=OFF \
            -DBUILD_qtgrpc=OFF \
            -DBUILD_qtlocation=OFF \
            -DBUILD_qtlottie=OFF \
            -DBUILD_qtmqtt=OFF \
            -DBUILD_qtmultimedia=OFF \
            -DBUILD_qtopcua=OFF \
            -DBUILD_qtpdf=OFF \
            -DBUILD_qtpositioning=OFF \
            -DBUILD_qtscxml=OFF \
            -DBUILD_qtsensors=OFF \
            -DBUILD_qtspeech=OFF \
            -DBUILD_qttranslations=OFF \
            -DBUILD_qtvirtualkeyboard=ON \
            -DBUILD_qtwayland=OFF \
            -DBUILD_qtwebchannel=OFF \
            -DBUILD_qtwebengine=OFF \
            -DBUILD_qtwebview=OFF \
            -DBUILD_qtgraphs=ON \
            -DBUILD_qthttpserver=ON \
            -DBUILD_qtquick3d=ON \
            -DBUILD_qtserialbus=ON \
            -DBUILD_qtserialport=ON \
            -DBUILD_qtshadertools=ON \
            -DBUILD_qttasktree=ON \
            -DBUILD_qtwebsockets=ON

          echo ">>> Building with $(nproc) cores..."
          cmake --build "${BUILD_DIR}" -j$(nproc)

          echo ">>> Installing to ${{ env.QT_INSTALL_DIR }}..."
          sudo cmake --install "${BUILD_DIR}"

          echo ">>> Cleaning up build tree to save disk space..."
          rm -rf "${SRC_DIR}" "${BUILD_DIR}" "${RUNNER_TEMP}/qt-src.tar.xz"



      - name: Build .deb
        env:
          QT_ROOT_DIR: ${{ env.QT_INSTALL_DIR }}
        run: |
          chmod +x packaging/linux/cpack_deb.sh
          packaging/linux/cpack_deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-arm64
          path: dist/data-logger-app_${{ needs.prepare.outputs.version }}_arm64.deb
          if-no-files-found: error
          retention-days: 14


  release:
    needs: [prepare, build-deb-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: find release-assets -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Data Logger ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          body: |
            ## Data Logger ${{ needs.prepare.outputs.version }}

            | Platform | File | Install |
            |----------|------|---------|
            | Raspberry Pi OS arm64 | `data-logger-app_*_arm64.deb` | `sudo apt install ./data-logger-app_*_arm64.deb` |


            Built from tag `${{ needs.prepare.outputs.tag }}`.
          files: |
            release-assets/**/*.deb
