name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Release Binary
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-15 ccache rsync patchelf \
            qt6-base-dev qt6-declarative-dev qt6-quickcontrols2-dev \
            qt6-serialbus-dev qt6-serialport-dev \
            qt6-httpserver-dev qt6-websockets-dev \
            qt6-graphs-dev qt6-quick3d-dev

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: build-release
          key: cmake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'ui/qml/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: |
          cmake -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build-release --parallel $(nproc)

      - name: Package release archive
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p release_package

          cp build-release/DataLogger release_package/
          cp -r config assets release_package/
          [ -d docs ] && cp -r docs release_package/ || true

          tar -czvf datalogger-release-${VERSION}.tar.gz -C release_package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: datalogger-release-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
