name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Release Binary
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache rsync

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Nuitka
        uses: actions/cache@v5
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'scripts/build_nuitka.sh', 'scripts/stage_pyside_qml.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Virtual Environment & Verify Python
        run: |
          python3 -m venv venv-build
          venv-build/bin/python --version
          venv-build/bin/pip install --upgrade pip

      - name: Install dependencies
        run: |
          venv-build/bin/pip install -e .
          venv-build/bin/pip install "Nuitka[onefile]"

      - name: Build Standalone Binary with Nuitka
        run: |
          chmod +x scripts/build_nuitka.sh scripts/stage_pyside_qml.sh
          PYTHON="${{ github.workspace }}/venv-build/bin/python" scripts/build_nuitka.sh

      - name: Generate VERSION file & Package Release Archive
        run: |
          mkdir -p release_package
          
          # Sinh VERSION
          PYTHONPATH=. venv-build/bin/python -c "import core._version as v; print(v.__version__)" > VERSION
          
          # Copy các file cần thiết
          cp VERSION deploy.sh release_package/
          cp datalogger release_package/ || cp main.bin release_package/datalogger
          cp -r config ui release_package/
          [ -d docs ] && cp -r docs release_package/
          
          # Nén tarball
          tar -czvf datalogger-release-${{ github.ref_name }}.tar.gz -C release_package .

      - name: Build .deb package
        run: |
          chmod +x scripts/build_deb.sh
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          ARCH="arm64"
          scripts/build_deb.sh "$VERSION" "$ARCH"
          echo "DEB_FILE=datalogger_${VERSION}_${ARCH}.deb" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            datalogger-release-${{ github.ref_name }}.tar.gz
            ${{ env.DEB_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true
