version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # PySide6 và shiboken6 phải cùng version → group chung
      pyside:
        patterns:
          - "PySide6*"
          - "shiboken6*"
      # Gom các bump minor/patch lại để giảm noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions (uses: actions/...@vX)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
